name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Mathlib master changes without a push here.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: cargo test --locked

      - name: Check the wasm build
        run: cargo check --locked --lib --target wasm32-unknown-unknown

      - name: Test the gallery scripts
        run: python3 scripts/gallery/test_gallery.py

      - name: Certify the examples
        run: |
          mkdir examples
          i=0
          for n in 1021 '2^127 - 1' '3 * 2^276 + 1'; do
            i=$((i + 1))
            cargo run --quiet -- "$n" --quiet --target mathlib > "examples/$i.lean"
          done

      - name: Check the examples against Mathlib master
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          git clone --depth 1 https://github.com/leanprover-community/mathlib4.git
          cd mathlib4
          lake exe cache get $(sed -n 's/^import //p' ../examples/*.lean | sort -u)
          for f in ../examples/*.lean; do
            cat "$f"
            lake env lean "$f"
          done
